services:
  - type: web
    name: insurewise-ai-backend
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: EMBEDDING_PROVIDER
        value: local
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DEMO_MODE
        value: "false"
      - key: GROQ_API_KEY
        sync: false
